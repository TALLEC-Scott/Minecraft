name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Linux build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AudioAssetsTest decodes every sound, so they must be real files, not
      # LFS pointers. Pull only assets/Sounds (~2.5 MB), not the screenshots.
      - name: Fetch LFS sounds
        run: git lfs pull --include="assets/Sounds/**"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev xorg-dev

      - name: Configure
        # clang-tidy is disabled in CI for robustness across toolchain versions;
        # re-enable locally with a plain cmake configure (it defaults to ON).
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CLANG_TIDY=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  web:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # sounds.data packages assets/Sounds; real files, not LFS pointers.
      - name: Fetch LFS sounds
        run: git lfs pull --include="assets/Sounds/**"

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.5 # match the local SDK so CI and releases build alike

      - name: Configure
        run: emcmake cmake -B build_web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_web -j$(nproc)

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-web
          path: |
            build_web/minecraft.html
            build_web/minecraft.js
            build_web/minecraft.wasm
            build_web/minecraft.data
            build_web/sounds.js
            build_web/sounds.data
