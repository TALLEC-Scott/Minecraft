name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Linux build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev xorg-dev

      - name: Configure
        # clang-tidy is disabled in CI for robustness across toolchain versions;
        # re-enable locally with a plain cmake configure (it defaults to ON).
        # -Werror=array-bounds is downgraded to a warning: GCC 13+ reports a
        # false positive on std::vector::resize in tests/test_net_protocol.cpp
        # (the test deliberately crafts an oversized packet). The project's
        # -Werror policy stays in force for everything else.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CLANG_TIDY=OFF -DCMAKE_CXX_FLAGS="-Wno-error=array-bounds"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  web:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Configure
        run: emcmake cmake -B build_web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_web -j$(nproc)

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-web
          path: |
            build_web/minecraft.html
            build_web/minecraft.js
            build_web/minecraft.wasm
            build_web/minecraft.data
